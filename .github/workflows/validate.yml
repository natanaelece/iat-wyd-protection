name: Validate public package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate repository package
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import struct
          import xml.etree.ElementTree as ET

          root = Path('.')

          required = [
              'LICENSE',
              'README.md',
              'src/P1IatAudit.h',
              'src/P1IatAudit.cpp',
              'src/P2InlineAudit.h',
              'src/P2InlineAudit.cpp',
              'docs/IMPLEMENTATION.md',
              'docs/TESTING.md',
              'docs/PROVENANCE.md',
              'docs/images/integrity-blocked-login.png',
              'examples/TMSelectServerScene_GATE_SNIPPET.cpp',
              'examples/TMProject.vcxproj_SNIPPETS.xml',
              'examples/TMProject.vcxproj.filters_SNIPPETS.xml',
              '.github/workflows/release.yml',
          ]
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              raise SystemExit('MISSING_REQUIRED_FILES=' + ','.join(missing))

          blocked_suffixes = {
              '.exe', '.dll', '.sys', '.msi', '.pdb', '.obj', '.lib',
              '.zip', '.7z', '.rar', '.bin', '.dmp', '.pcap', '.pcapng'
          }
          blocked = [
              str(p) for p in root.rglob('*')
              if p.is_file() and p.suffix.lower() in blocked_suffixes
          ]
          if blocked:
              raise SystemExit('BLOCKED_BINARY_ARTIFACTS=' + ','.join(blocked))

          temporary_names = []
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              lowered = p.name.lower()
              if lowered.endswith(('.tmp', '.bak', '.orig')) or 'placeholder' in lowered:
                  temporary_names.append(str(p))
          if temporary_names:
              raise SystemExit('TEMPORARY_OR_PLACEHOLDER_FILES=' + ','.join(temporary_names))

          text_suffixes = {'.md', '.txt', '.cpp', '.h', '.xml', '.yml', '.yaml'}
          forbidden_hits = []
          forbidden_term = 'me' + 'dusa'
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in text_suffixes:
                  continue
              text = p.read_text(encoding='utf-8', errors='strict')
              if forbidden_term in text.casefold():
                  forbidden_hits.append(str(p))
          if forbidden_hits:
              raise SystemExit('FORBIDDEN_PROJECT_TERM=' + ','.join(forbidden_hits))

          p1_header = (root / 'src/P1IatAudit.h').read_text(encoding='utf-8')
          p1_cpp = (root / 'src/P1IatAudit.cpp').read_text(encoding='utf-8')
          p2_header = (root / 'src/P2InlineAudit.h').read_text(encoding='utf-8')
          p2_cpp = (root / 'src/P2InlineAudit.cpp').read_text(encoding='utf-8')
          gate = (root / 'examples/TMSelectServerScene_GATE_SNIPPET.cpp').read_text(encoding='utf-8')
          implementation = (root / 'docs/IMPLEMENTATION.md').read_text(encoding='utf-8')
          testing = (root / 'docs/TESTING.md').read_text(encoding='utf-8')
          provenance = (root / 'docs/PROVENANCE.md').read_text(encoding='utf-8')
          readme = (root / 'README.md').read_text(encoding='utf-8')
          release = (root / '.github/workflows/release.yml').read_text(encoding='utf-8')

          expected_blobs = {
              'src/P1IatAudit.h': 'a2b9958ccebdc14fc7a6500bdf39a820c8def29a',
              'src/P1IatAudit.cpp': 'bdd71dcf0578498d623afcb42ed73175c6a814fd',
              'src/P2InlineAudit.h': '7164919f44b79d19767e7511a54c9c77c1503dea',
              'src/P2InlineAudit.cpp': '91611a59bba7e14effea47dd2bccd9cd2404e085',
          }
          for path, expected in expected_blobs.items():
              observed = subprocess.check_output(
                  ['git', 'hash-object', path], text=True
              ).strip()
              if observed != expected:
                  raise SystemExit(
                      f'SOURCE_PROVENANCE_MISMATCH={path}:{observed}:{expected}'
                  )

          for marker in (
              'enum class Result', 'Clean', 'Anomaly', 'ResolutionError',
              'AuditRecordCount = 2', 'AuditCurrentProcess'
          ):
              if marker not in p1_header:
                  raise SystemExit('P1_HEADER_CONTRACT_MISSING=' + marker)

          for marker in (
              'GetAdaptersInfo', 'connect', 'IPHLPAPI.DLL', 'WSOCK32.dll',
              'WS2_32.dll', 'GetProcAddress', 'VirtualQuery',
              'UnauthorizedIatTarget', 'LegitimateForwarder',
              'static_assert(sizeof(void*) == sizeof(DWORD)'
          ):
              if marker not in p1_cpp:
                  raise SystemExit('P1_CPP_CONTRACT_MISSING=' + marker)

          for marker in (
              'enum class Result', 'AuditRecordCount = 2',
              'EvaluateWindow', 'AuditCurrentProcess'
          ):
              if marker not in p2_header:
                  raise SystemExit('P2_HEADER_CONTRACT_MISSING=' + marker)

          for marker in (
              'GetAdaptersInfo', 'connect', 'VirtualQuery', 'CreateFileW',
              'CreateFileMappingW', 'MapViewOfFile',
              'IMAGE_DIRECTORY_ENTRY_BASERELOC', 'MEM_COMMIT', 'MEM_IMAGE',
              'EvaluateWindow', 'static_assert(sizeof(void*) == sizeof(DWORD)'
          ):
              if marker not in p2_cpp:
                  raise SystemExit('P2_CPP_CONTRACT_MISSING=' + marker)

          for marker in (
              'P1IatAudit::AuditCurrentProcess',
              'P2InlineAudit::AuditCurrentProcess',
              'p1AuditCount == P1IatAudit::AuditRecordCount',
              'p2AuditCount == P2InlineAudit::AuditRecordCount',
              'record.result != P1IatAudit::Result::Clean',
              'record.result != P2InlineAudit::Result::Clean',
              'clientIntegrityAllowed = p1AllRecordsClean && p2AllRecordsClean',
              'if (!clientIntegrityAllowed)',
              'Falha na verificacao de integridade do cliente.',
              'return 1;'
          ):
              if marker not in gate:
                  raise SystemExit('GATE_CONTRACT_MISSING=' + marker)

          for forbidden in (
              'clientIntegrityCheckCompleted',
              'static bool clientIntegrityAllowed'
          ):
              if forbidden in gate:
                  raise SystemExit('ONE_SHOT_GATE_PRESENT=' + forbidden)

          block_pos = gate.find('if (!clientIntegrityAllowed)')
          if block_pos < 0:
              raise SystemExit('GATE_BLOCK_DECISION_MISSING')
          if gate.find('P1IatAudit::AuditCurrentProcess') > block_pos:
              raise SystemExit('GATE_ORDER_INVALID=P1_AFTER_DECISION')
          if gate.find('P2InlineAudit::AuditCurrentProcess') > block_pos:
              raise SystemExit('GATE_ORDER_INVALID=P2_AFTER_DECISION')

          for marker in (
              'B_LOGIN_OK', 'ConnectServer', 'P1IatAudit.h', 'P2InlineAudit.h',
              'cada tentativa de login'
          ):
              if marker not in implementation:
                  raise SystemExit('IMPLEMENTATION_GUIDE_MISSING=' + marker)

          for marker in (
              'P1', 'P2', 'CLEAN', 'ANOMALY', 'RESOLUTION_ERROR',
              'GetAdaptersInfo', 'connect', 'PER_LOGIN_REAUDIT'
          ):
              if marker not in testing:
                  raise SystemExit('TEST_GUIDE_MISSING=' + marker)

          for marker in (
              'SOURCE_PROVENANCE=PINNED_GIT_BLOBS',
              'RUNTIME_COMPATIBILITY_REQUIRES_EXACT_BUILD_TEST=true'
          ):
              if marker not in provenance:
                  raise SystemExit('PROVENANCE_MARKER_MISSING=' + marker)

          if '## Limitações' in readme or '## 10. Limites' in implementation:
              raise SystemExit('PUBLIC_LIMITATIONS_SECTION_PRESENT')

          for link in (
              'docs/IMPLEMENTATION.md',
              'docs/TESTING.md',
              'docs/PROVENANCE.md',
              'docs/images/integrity-blocked-login.png'
          ):
              if link not in readme or not (root / link).exists():
                  raise SystemExit('README_LINK_INVALID=' + link)

          for marker in (
              'v2.0.0',
              'WYD-Client-Integrity-Protection-P1-P2.zip',
              'SHA256SUMS-P1-P2.txt',
              'gh release upload',
              '--clobber'
          ):
              if marker not in release:
                  raise SystemExit('RELEASE_WORKFLOW_MARKER_MISSING=' + marker)

          for xml_path in (
              'examples/TMProject.vcxproj_SNIPPETS.xml',
              'examples/TMProject.vcxproj.filters_SNIPPETS.xml'
          ):
              text = (root / xml_path).read_text(encoding='utf-8')
              ET.fromstring('<Root>\n' + text + '\n</Root>')
              if 'P1IatAudit' not in text or 'P2InlineAudit' not in text:
                  raise SystemExit('PROJECT_SNIPPET_LAYER_MISSING=' + xml_path)

          image = (root / 'docs/images/integrity-blocked-login.png').read_bytes()
          png_magic = b'\x89PNG\r\n\x1a\n'
          if len(image) < 24 or image[:8] != png_magic or image[12:16] != b'IHDR':
              raise SystemExit('BLOCKED_LOGIN_IMAGE_INVALID_PNG')
          width, height = struct.unpack('>II', image[16:24])
          if (width, height) != (680, 125):
              raise SystemExit(f'BLOCKED_LOGIN_IMAGE_DIMENSIONS={(width, height)}')

          print('PUBLIC_PACKAGE_VALIDATION=PASS')
          print('LAYERS=P1_IAT,P2_INLINE')
          print('AUDIT_FREQUENCY=EVERY_LOGIN_ATTEMPT')
          print('SOURCE_PROVENANCE=PINNED_GIT_BLOBS')
          print('FORBIDDEN_PROJECT_TERM_CHECK=PASS')
          print('PUBLIC_DOCUMENTATION_DETAIL=REDUCED')
          print('RELEASE_WORKFLOW=v2.0.0_REFRESHABLE')
